name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ClaudeSwitch.xcodeproj \
            -scheme ClaudeSwitch \
            -configuration Release \
            -derivedDataPath "build/${{ matrix.arch }}" \
            -destination "generic/platform=macOS" \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          set -euo pipefail
          product_dir="build/${{ matrix.arch }}/Build/Products/Release"
          artifact="ClaudeSwitch-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent "$product_dir/ClaudeSwitch.app" "$artifact"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitch-${{ matrix.arch }}
          path: ClaudeSwitch-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          generate_release_notes: true
